<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebshopLink Demo Shop</title>
    <!--
      Transparency first, before any other stylesheet or script. The page is
      rendered in a transparent in-game browser overlaid on the Minecraft world;
      if the transparent background only arrived with an external stylesheet, the
      browser would paint the default opaque page background for the frames until
      that stylesheet loaded — a white flash over the world.
      NOTE: CSS backdrop-filter cannot blur the game world — the world is not
      part of the page, so the browser has nothing to blur. Blurring the world
      must be done on the Minecraft render side (ShopBrowserScreen).
    -->
    <style>
      html,
      body {
        background: transparent;
      }
    </style>
    <!--
      Tailwind via the Play CDN keeps this demo a zero-build, single-file page.
      For a production shop you'd compile Tailwind instead (see README).
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Slim, themed scrollbar so the floating panel feels self-contained. */
      #panel ::-webkit-scrollbar {
        width: 8px;
      }
      #panel ::-webkit-scrollbar-thumb {
        background: rgb(71 85 105 / 0.8);
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="h-full text-slate-100">
    <!-- Full-viewport blurred + dimmed backdrop; clicks fall through visually. -->
    <div
      id="backdrop"
      class="fixed inset-0 flex items-center justify-center bg-slate-950/40 p-4"
    >
      <!-- The floating shop window. -->
      <div
        id="panel"
        class="flex max-h-[88vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-slate-700/70 bg-slate-900/90 shadow-2xl ring-1 ring-black/40 backdrop-blur-xl"
      >
        <div id="app" class="overflow-y-auto p-6">
          <p class="text-slate-400">Loading session…</p>
        </div>
      </div>
    </div>

    <script>
      // The session uuid is the last path segment: /shop/<uuid>
      const uuid = location.pathname.split("/").pop();
      const app = document.getElementById("app");

      // Local cart mirrors the server cart; we POST the whole thing on change.
      let state = null;

      async function load() {
        const res = await fetch(`/api/session/${uuid}`);
        if (!res.ok) {
          app.innerHTML = `<p class="text-red-400">Session not found or expired.</p>`;
          signalReady();
          return;
        }
        state = await res.json();
        render();
      }

      async function pushCart() {
        const res = await fetch(`/api/session/${uuid}/cart`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ buy: state.cart.buy, sell: state.cart.sell }),
        });
        if (res.ok) {
          state = await res.json();
          render();
        }
      }

      function setBuy(id, qty) {
        qty = Math.max(0, qty | 0);
        if (qty === 0) delete state.cart.buy[id];
        else state.cart.buy[id] = qty;
        pushCart();
      }

      function setSell(slot, qty) {
        qty = Math.max(0, qty | 0);
        if (qty === 0) delete state.cart.sell[slot];
        else state.cart.sell[slot] = qty;
        pushCart();
      }

      function deltaRow(label, items, cls) {
        if (!items.length) return "";
        const pills = items
          .map(
            (i) =>
              `<span class="inline-block rounded bg-slate-700 px-2 py-0.5 text-sm">${i.count}× ${i.name}</span>`,
          )
          .join(" ");
        return `<div class="mb-1"><span class="${cls} font-semibold">${label}</span> ${pills}</div>`;
      }

      // The mod keeps its browser hidden until the page says it is painted, so a
      // half-drawn shop never flashes over the world. Setting this title is the
      // handshake; without it the mod falls back to the document's load event.
      function signalReady() {
        if (document.title !== "webshoplink:ready") {
          document.title = "webshoplink:ready";
        }
      }

      function render() {
        const p = state.preview;
        const locked = state.status !== "open";

        const catalog = state.catalog
          .map((e) => {
            const qty = state.cart.buy[e.id] ?? 0;
            return `
              <div class="rounded-lg border border-slate-700 bg-slate-800 p-4">
                <div class="text-2xl">${e.emoji ?? "📦"}</div>
                <div class="mt-1 font-semibold">${e.name}${e.hasNbt ? ' <span class="text-xs text-aqua-400 text-cyan-400">(NBT)</span>' : ""}</div>
                <div class="text-xs text-slate-400">${e.count}× ${e.itemId}</div>
                <div class="mt-2 text-emerald-400 font-medium">${e.price} 💚 / unit</div>
                <div class="mt-3 flex items-center gap-2">
                  <button class="h-8 w-8 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40" ${locked ? "disabled" : ""} onclick="setBuy('${e.id}', ${qty - 1})">−</button>
                  <span class="w-8 text-center">${qty}</span>
                  <button class="h-8 w-8 rounded bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40" ${locked ? "disabled" : ""} onclick="setBuy('${e.id}', ${qty + 1})">+</button>
                </div>
              </div>`;
          })
          .join("");

        const sell = state.sellable.length
          ? state.sellable
              .map((s) => {
                const qty = state.cart.sell[s.slot] ?? 0;
                return `
                <div class="flex items-center justify-between rounded-lg border border-slate-700 bg-slate-800 px-4 py-2">
                  <div>
                    <span class="mr-1">${s.emoji ?? "📦"}</span>
                    <span class="font-medium">${s.name}</span>
                    <span class="text-xs text-slate-400">×${s.count} in slot ${s.slot} · sells for ${s.unitSell} 💚</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button class="h-8 w-8 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40" ${locked ? "disabled" : ""} onclick="setSell('${s.slot}', ${qty - 1})">−</button>
                    <span class="w-8 text-center">${qty}</span>
                    <button class="h-8 w-8 rounded bg-rose-600 hover:bg-rose-500 disabled:opacity-40" ${locked || qty >= s.count ? "disabled" : ""} onclick="setSell('${s.slot}', ${qty + 1})">+</button>
                  </div>
                </div>`;
              })
              .join("")
          : `<p class="text-sm text-slate-400">You have no sellable items in your inventory.</p>`;

        const errors = p.errors.length
          ? `<div class="rounded bg-red-900/50 border border-red-700 p-3 text-sm text-red-200">${p.errors.join("<br>")}</div>`
          : "";

        const statusBanner = locked
          ? `<div class="rounded bg-amber-900/40 border border-amber-700 p-3 text-amber-200 text-sm mb-4">
               This session is <b>${state.status}</b> — the cart is locked. Start a new <code>/shop</code> session in game to shop again.
             </div>`
          : "";

        app.innerHTML = `
          <header class="mb-6 border-b border-slate-700/70 pb-4">
            <h1 class="text-2xl font-bold">🛒 ${state.shopSlug} shop</h1>
            <p class="text-sm text-slate-400">Player <code>${state.playerId}</code> · session <code>${state.uuid}</code></p>
          </header>

          ${statusBanner}

          <div class="grid gap-6 lg:grid-cols-3">
            <section class="lg:col-span-2">
              <h2 class="mb-3 text-lg font-semibold">Buy</h2>
              <div class="grid gap-3 sm:grid-cols-2">${catalog}</div>

              <h2 class="mt-6 mb-3 text-lg font-semibold">Sell</h2>
              <div class="space-y-2">${sell}</div>
            </section>

            <aside class="space-y-3 lg:sticky lg:top-0 lg:self-start">
              <div class="rounded-lg border border-slate-700 bg-slate-800 p-4">
                <h2 class="mb-2 text-lg font-semibold">Summary</h2>
                <div class="flex justify-between text-sm"><span>Balance now</span><span>${p.balanceBefore} 💚</span></div>
                <div class="flex justify-between text-sm"><span>After trade</span><span class="${p.balanceAfter < p.balanceBefore ? "text-emerald-400" : "text-slate-200"}">${p.balanceAfter} 💚</span></div>
                <hr class="my-3 border-slate-700" />
                ${deltaRow("Gain", p.added, "text-emerald-400")}
                ${deltaRow("Lose", p.removed, "text-rose-400")}
                ${p.added.length || p.removed.length ? "" : '<p class="text-sm text-slate-400">Cart is empty.</p>'}
              </div>
              ${errors}
              <div class="rounded-lg border border-sky-800 bg-sky-950/50 p-4 text-sm text-sky-200">
                When you're happy with the cart, click <b>Finish Trade</b> in the
                button bar below this browser window to apply it. <b>Cancel</b> (or
                closing with <kbd>Esc</kbd>) discards the session.
              </div>
            </aside>
          </div>
        `;

        // Two frames: one for the browser to lay the new DOM out, one to paint it.
        requestAnimationFrame(() => requestAnimationFrame(signalReady));
      }

      load();
    </script>
  </body>
</html>
