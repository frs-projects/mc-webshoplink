# Example mod config for talking to this demo server.
# Copy this into your server's `config/webshoplink-common.toml`.
#
# The defaults already match the demo, so usually you don't need to change anything.

# Base URL for the shop API — matches the demo server on port 8080.
apiBaseUrl = "http://localhost:8080/api/shop"

# Endpoints (the demo implements exactly these paths).
shopEndpoint = "/initiate"
shopCheckoutEndpoint = "/{uuid}/checkout"
shopAppliedEndpoint = "/{uuid}/setApplied"
shopCancelEndpoint = "/{uuid}/cancel"

# Turn these on to see the full request/response traffic in the server log,
# which pairs nicely with the demo server's own console output.
debugEnabled = true
debugVerbosity = "ALL"
