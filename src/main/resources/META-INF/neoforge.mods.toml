modLoader = "javafml"
loaderVersion = "${javafml_range}"
license = "${license}"
issueTrackerURL = "${source}/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
description = '''${description}'''
authors = "${authors}"
displayURL = "${source}"
# Has both server and client components (the in-game browser). The payloads are optional, so
# vanilla clients can still join; /shop then falls back.

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range_forgelike}"
ordering = "NONE"
side = "BOTH"

# MCEF provides the in-game Chromium browser. Only required on the client; the
# dedicated server never touches it.
[[dependencies.${id}]]
modId = "mcef"
type = "required"
versionRange = "${mcef_range}"
ordering = "AFTER"
side = "CLIENT"
