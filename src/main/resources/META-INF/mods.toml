modLoader = "javafml"
loaderVersion = "${forge_range}"
license = "${license}"
issueTrackerURL = "${source}/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
description = '''${description}'''
authors = "${authors}"
displayURL = "${source}"
# Has both server and client components (the in-game browser). The network channel accepts a
# missing mod on the other end, so vanilla clients can still join; /shop then falls back.
displayTest = "MATCH_VERSION"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range_forgelike}"
ordering = "NONE"
side = "BOTH"

# Rinku (formerly MCEF) provides the in-game Chromium browser. Only required on the client; the
# dedicated server never touches it.
[[dependencies.${id}]]
modId = "rinku"
mandatory = true
versionRange = "${rinku_range}"
ordering = "AFTER"
side = "CLIENT"
